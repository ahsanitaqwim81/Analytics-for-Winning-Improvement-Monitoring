// ATTACK TYPE BREAKDOWN
// ============================================================
function buildAttackBreakdown() {
    const evs = md.events || [];
    const types = ['Set-play','Fastbreak'];

    const buildTeamData = (team) => {
        const shots = evs.filter(e => (e.type==='GOAL'||e.type==='MISS') && e.team===team && e.attackType);
        const total = shots.length || 1;
        return types.map(t => {
            const ev = shots.filter(e=>e.attackType===t);
            const goals = ev.filter(e=>e.type==='GOAL').length;
            const miss  = ev.filter(e=>e.type==='MISS').length;
            const pct = Math.round((ev.length/total)*100);
            return { type: t, goals, miss, total: ev.length, pct };
        });
    };

    const renderAttack = (team) => {
        const data = buildTeamData(team);
        const name = team==='A' ? (md.teamA?.name||'HOME') : (md.teamB?.name||'AWAY');
        const maxCount = Math.max(...data.map(d=>d.total), 1);
        const rows = data.map(d => `
            <div class="attack-type-row">
                <div class="attack-type-label">${d.type==='Set-play'?'🔄':'⚡'} ${d.type}</div>
                <div class="attack-type-bars">
                    <div class="attack-mini-bar" style="width:${(d.total/maxCount)*80}%"></div>
                </div>
                <div style="display:flex;gap:5px;align-items:center">
                    <span class="stat-num">${d.total}</span>
                    <span style="font-size:10px;color:#aaa">(${d.goals}⚽ ${d.miss}✕)</span>
                </div>
            </div>`).join('');
        return `
        <div class="attack-card">
            <div class="attack-card-title" style="display:flex;align-items:center;gap:8px">
                <div style="width:10px;height:10px;border-radius:50%;background:${team==='A'?(md.teamA?.color||'#e74c3c'):(md.teamB?.color||'#1abc9c')}"></div>
                ${name.toUpperCase()} — Tipe Serangan
            </div>
            ${rows}
        </div>`;
    };

    return `
    <div class="section-title">⚡ Tipe Serangan</div>
    <div class="attack-cards">
        ${renderAttack('A')}
        ${renderAttack('B')}
    </div>`;
}

// ============================================================
// SHOT ZONES (goal-grid visual)
// ============================================================
function buildShotZones() {
    const evs = md.events || [];

    const buildGrid = (team) => {
        const shots = evs.filter(e => (e.type==='GOAL'||e.type==='MISS') && e.team===team && e.zone);
        const cellData = {};
        GOAL_ZONE_ORDER.forEach(z => { cellData[z] = { g:0, m:0 }; });
        shots.forEach(e => {
            if (cellData[e.zone]) {
                if (e.type==='GOAL') cellData[e.zone].g++;
                else cellData[e.zone].m++;
            }
        });

        return GOAL_ZONE_ORDER.map(z => {
            const d = cellData[z];
            const cls = d.g > 0 ? 'goal-cell has-goals' : d.m > 0 ? 'goal-cell has-miss' : 'goal-cell';
            const short = z.replace('Atas','AT').replace('Tengah','TG').replace('Bawah','BW').replace(' Kiri','K').replace(' Kanan','KN').replace('Kiri','K').replace('Kanan','KN');
            return `<div class="${cls}">
                ${d.g>0 ? `<div class="cell-goals">${d.g}</div>` : ''}
                ${d.m>0 ? `<div class="cell-miss">✕${d.m}</div>` : ''}
                <div class="cell-label">${short}</div>
            </div>`;
        }).join('');
    };

    const offTarget = (team) => {
        const evs2 = evs.filter(e=>(e.type==='GOAL'||e.type==='MISS')&&e.team===team);
        const lk = evs2.filter(e=>e.zone==='Luar Kiri').length;
        const la = evs2.filter(e=>e.zone==='Luar Atas').length;
        const lkn = evs2.filter(e=>e.zone==='Luar Kanan').length;
        const tm = evs2.filter(e=>e.zone==='Tiang/Mistar').length;
        const skip = evs2.filter(e=>!e.zone).length;
        const items = [lk&&`Luar Kiri: ${lk}`, la&&`Luar Atas: ${la}`, lkn&&`Luar Kanan: ${lkn}`, tm&&`Tiang: ${tm}`, skip&&`Tanpa zona: ${skip}`].filter(Boolean);
        return items.length ? `<div style="font-size:10px;color:var(--gray-text);margin-top:8px;text-align:center">Off-target: ${items.join(' · ')}</div>` : '';
    };

    const buildCard = (team) => {
        const name = team==='A' ? (md.teamA?.name||'HOME') : (md.teamB?.name||'AWAY');
        const color = team==='A' ? (md.teamA?.color||'#e74c3c') : (md.teamB?.color||'#1abc9c');
        const goals = evs.filter(e=>e.type==='GOAL'&&e.team===team).length;
        const shots = evs.filter(e=>(e.type==='GOAL'||e.type==='MISS')&&e.team===team).length;
        return `
        <div class="shot-chart-card">
            <div class="shot-chart-header">
                <div style="display:flex;align-items:center;gap:8px">
                    <div style="width:10px;height:10px;border-radius:50%;background:${color}"></div>
                    <strong>${name.toUpperCase()}</strong>
                </div>
                <div style="font-size:11px;color:var(--gray-text)">${goals}⚽ / ${shots} tembakan</div>
            </div>
            <div class="shot-chart-body">
                <div class="goal-grid">${buildGrid(team)}</div>
                ${offTarget(team)}
                <div class="shot-legend" style="margin-top:10px">
                    <div class="legend-item"><div class="legend-dot" style="background:rgba(39,174,96,0.5)"></div> Gol</div>
                    <div class="legend-item"><div class="legend-dot" style="background:rgba(231,76,60,0.4)"></div> Miss</div>
                </div>
            </div>
        </div>`;
    };

    return `
    <div class="section-title">🎯 Peta Tembakan ke Gawang</div>
    <div class="shot-charts">
        ${buildCard('A')}
        ${buildCard('B')}
    </div>`;
}

// ============================================================
// PLAYER PLAYING TIME CALCULATION
// ============================================================
function getPlayingMinutes(teamChar) {
    const team = teamChar === 'A' ? md.teamA : md.teamB;
    const teamName = team?.name;
    const players = team?.players || [];
    const stats = team?.stats || {};
    const playerState = team?.playerState || {};
    const duration = md.info?.duration || 30; // duration per period in minutes
    const events = md.events || [];

    // Initialize playing time in seconds
    const playingSeconds = {};
    players.forEach(p => {
        playingSeconds[p.nomor] = 0;
    });

    // Determine state at the end of the match
    const states = {};
    players.forEach(p => {
        const st = stats[p.nomor] || {};
        const isSuspended = st.redCard || st.blueCard;
        states[p.nomor] = isSuspended ? 'bench' : (playerState[p.nomor] || 'bench');
    });

    // Convert time string to seconds remaining
    function timeToSec(timeStr) {
        if (!timeStr) return 0;
        const parts = timeStr.split(':');
        if (parts.length !== 2) return 0;
        return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
    }

    // Build checkpoints in reverse chronological order
    const checkpoints = [];

    // 1. Current state of the timer if the match is still running
    const hasMatchEnd = events.some(e => e.type === 'MATCH_END');
    if (!hasMatchEnd) {
        checkpoints.push({
            period: md.currentPeriod || 1,
            seconds: md.timeLeft != null ? md.timeLeft : duration * 60,
            type: 'CURRENT_TIME'
        });
    }

    // 2. Add checkpoints from events
    events.forEach(ev => {
        if (ev.type === 'PERIOD_START' || ev.type === 'PERIOD_END' || ev.type === 'MATCH_END') {
            checkpoints.push({
                period: ev.period || 1,
                seconds: timeToSec(ev.time),
                type: ev.type
            });
        } else if (ev.type === 'SUB' && ev.teamName === teamName) {
            checkpoints.push({
                period: ev.period || 1,
                seconds: timeToSec(ev.time),
                type: 'SUB',
                event: ev
            });
        } else if (ev.type === 'FOUL' && ev.teamName === teamName && (ev.subtype === 'Kartu Merah' || ev.subtype === 'Kartu Biru')) {
            checkpoints.push({
                period: ev.period || 1,
                seconds: timeToSec(ev.time),
                type: 'CARD',
                event: ev
            });
        } else if (ev.type === 'FOUL' && ev.teamName === teamName && ev.subtype === '2 Menit') {
            const T_susp = timeToSec(ev.time);
            checkpoints.push({
                period: ev.period || 1,
                seconds: T_susp,
                type: 'SUSPEND_START',
                event: ev
            });
            checkpoints.push({
                period: ev.period || 1,
                seconds: Math.max(0, T_susp - 120),
                type: 'SUSPEND_END',
                event: ev
            });
        }
    });

    // Sort checkpoints: newest to oldest
    // Higher period first; within same period, smaller remaining seconds first
    checkpoints.sort((a, b) => {
        if (a.period !== b.period) {
            return b.period - a.period;
        }
        return a.seconds - b.seconds;
    });

    // Backwards pass
    let currentPeriod = null;
    let currentSeconds = null;

    checkpoints.forEach(cp => {
        if (currentPeriod === null) {
            currentPeriod = cp.period;
            currentSeconds = cp.seconds;
            return;
        }

        if (cp.period !== currentPeriod) {
            // Close the current period (add remaining time to start of period)
            const interval = (duration * 60) - currentSeconds;
            if (interval > 0) {
                players.forEach(p => {
                    if (states[p.nomor] === 'court') {
                        playingSeconds[p.nomor] += interval;
                    }
                });
            }
            // Transition to new period
            currentPeriod = cp.period;
            currentSeconds = cp.seconds;
        } else {
            // Same period, different time checkpoint
            const interval = cp.seconds - currentSeconds;
            if (interval > 0) {
                players.forEach(p => {
                    if (states[p.nomor] === 'court') {
                        playingSeconds[p.nomor] += interval;
                    }
                });
            }
            currentSeconds = cp.seconds;
        }

        // Process state updates for this checkpoint (going backwards in time)
        if (cp.type === 'SUB' && cp.event) {
            if (cp.event.subOut) {
                states[cp.event.subOut.nomor] = 'court';
            }
            if (cp.event.subIn) {
                states[cp.event.subIn.nomor] = 'bench';
            }
        } else if (cp.type === 'CARD' && cp.event && cp.event.player) {
            states[cp.event.player.nomor] = 'court';
        } else if (cp.type === 'SUSPEND_START' && cp.event && cp.event.player) {
            states[cp.event.player.nomor] = 'court';
        } else if (cp.type === 'SUSPEND_END' && cp.event && cp.event.player) {
            states[cp.event.player.nomor] = 'bench';
        }
    });

    // Close the final period (oldest period, down to start of that period)
    if (currentPeriod !== null && currentSeconds !== null) {
        const interval = (duration * 60) - currentSeconds;
        if (interval > 0) {
            players.forEach(p => {
                if (states[p.nomor] === 'court') {
                    playingSeconds[p.nomor] += interval;
                }
            });
        }
    }

    // Convert seconds to formatted minutes and seconds (e.g. 23' 15" or 0')
    const playingMinutes = {};
    players.forEach(p => {
        const totalSecs = playingSeconds[p.nomor] || 0;
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        playingMinutes[p.nomor] = totalSecs > 0 ? `${mins}' ${secs.toString().padStart(2, '0')}"` : "0'";
    });

    return playingMinutes;
}

// ============================================================
// PLAYER TABLE
// ============================================================
function buildPlayerTable(team) {
    const data = team==='A' ? md.teamA : md.teamB;
    const name = data?.name || (team==='A'?'HOME':'AWAY');
    const color = data?.color || (team==='A'?'#e74c3c':'#1abc9c');
    const players = data?.players || [];
    const stats = data?.stats || {};
    const playingMinutes = getPlayingMinutes(team);

    const rows = players.map(p => {
        const s = stats[p.nomor] || {};
        const goals  = s.goals || 0;
        const misses = s.misses || 0;
        const saves  = s.saves || 0;
        const fouls  = s.fouls || 0;
        const shots  = goals + misses;
        const acc    = shots > 0 ? Math.round((goals/shots)*100) : null;
        const yCards = s.yellowCards || 0;
        const twoMin = s.twoMins || 0;
        const rCard  = s.redCard || false;
        const bCard  = s.blueCard || false;

        const state = data?.playerState?.[p.nomor] || 'bench';
        const suspended = rCard || bCard;

        const statusDot = suspended
            ? `<span style="color:var(--red);font-size:10px">SUSPEND</span>`
            : state === 'court'
            ? `<span style="width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block"></span>`
            : `<span style="width:7px;height:7px;border-radius:50%;background:var(--gray-mid);display:inline-block"></span>`;

        const cardHTML = [
            yCards > 0 ? `<span class="card-chip chip-yellow">${yCards}K</span>` : '',
            twoMin > 0 ? `<span class="card-chip chip-2min">${twoMin}×2'</span>` : '',
            rCard ? `<span class="card-chip chip-red">RED</span>` : '',
            bCard ? `<span class="card-chip chip-blue">BLU</span>` : '',
        ].join('');

        const accHTML = acc === null ? `<span class="acc-pill">-</span>` :
            acc >= 60 ? `<span class="acc-pill good">${acc}%</span>` :
            acc >= 40 ? `<span class="acc-pill mid">${acc}%</span>` :
            `<span class="acc-pill bad">${acc}%</span>`;

        const numCls = n => n===0 ? 'stat-num zero' : 'stat-num';

        return `<tr onclick="showPlayerDetail('${team}', '${p.nomor}')" class="player-row-clickable" title="Klik untuk melihat detail statistik ${p.nama}">

            <td><span class="stat-num" style="font-size:14px;color:var(--blue-main)">${playingMinutes[p.nomor] || "0'"}</span></td>
            <td><span class="${goals>0?'stat-num green':numCls(goals)}">${goals}</span></td>
            <td><span class="${misses>0?'stat-num red':numCls(misses)}">${misses}</span></td>
            <td>${accHTML}</td>
            <td><span class="${numCls(saves)}">${saves}</span></td>
            <td><span class="${fouls>0?'stat-num orange':numCls(fouls)}">${fouls}</span></td>
            <td>${cardHTML || '<span style="color:var(--gray-mid);font-size:11px">—</span>'}</td>
        </tr>`;
    }).join('');

    return `
    <div class="player-table-wrapper">
        <div class="section-title player-table-title">👤 Pemain — ${name.toUpperCase()}</div>
        <div class="player-table-card">
            <div class="player-table-header">
                <div class="jersey-mini" style="background:${color}"></div>
                ${name.toUpperCase()}
                <span style="font-size:11px;font-weight:400;opacity:.65;margin-left:6px">Coach: ${data?.coach||'-'}</span>
            </div>
            <div style="overflow-x:auto">
            <table class="rpt-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nama</th>
                        <th>MAIN</th>
                        <th>GOL</th>
                        <th>MISS</th>
                        <th>ACC</th>
                        <th>SAVE</th>
                        <th>FOUL</th>
                        <th>KARTU</th>
                    </tr>
                </thead>
                <tbody>${rows}</tbody>
            </table>
            </div>
        </div>
    </div>`;
}

function buildEventLog() {
    const evs = [...(md.events||[])].reverse();

    const items = evs.map(ev => {
        const icon = EVENT_ICONS[ev.type] || '•';
        if (ev.type==='PERIOD_START'||ev.type==='PERIOD_END'||ev.type==='MATCH_END') {
            const lbl = ev.type==='MATCH_END'?'PERTANDINGAN SELESAI':ev.type==='PERIOD_END'?'AKHIR BABAK':'MULAI BABAK';
            return `<div class="log-item period">${icon} ${lbl} ${ev.period||''}</div>`;
        }
        if (ev.type==='SUB') {
            return `<div class="log-item">
                <div class="log-icon">⇄</div>
                <div class="log-text"><strong>SUB</strong> ${ev.teamName||''} — #${ev.subOut?.nomor||'?'} → #${ev.subIn?.nomor||'?'}
                <br><span class="log-time">Babak ${ev.period} · ${ev.time}</span></div>
            </div>`;
        }

        const playerStr = ev.player ? ` <strong>#${ev.player.nomor}</strong> ${ev.player.nama}` : '';
        const subtypeStr = ev.subtype ? ` <span class="log-chip">${ev.subtype}</span>` : '';
        const attackStr = ev.attackType ? ` <span class="log-chip attack">⚡${ev.attackType}</span>` : '';
        const zoneStr = ev.zone ? ` <span class="log-chip zone">📍${ev.zone}</span>` : '';

        const cls = ev.type==='GOAL'?'goal':ev.type==='MISS'?'miss':
            ev.type==='FOUL'?(ev.subtype==='Kartu Merah'?'redcard':ev.subtype==='Kartu Biru'?'bluecard':ev.subtype==='Kartu Kuning'?'card':'foul'):'';

        return `<div class="log-item ${cls}">
            <div class="log-icon">${icon}</div>
            <div class="log-text">
                <strong>${ev.type}</strong> <span style="color:var(--blue-main)">${ev.teamName||''}</span>${playerStr}${subtypeStr}${attackStr}${zoneStr}
                <br><span class="log-time">Babak ${ev.period} · ${ev.time}</span>
            </div>
        </div>`;
    }).join('');

    return `
    <div class="section-title">📋 Event Log</div>
    <div class="log-card">
        <div class="log-card-header">
            Kronologi Aksi
            <span style="font-size:11px;font-weight:400;opacity:.65">${evs.length} kejadian</span>
        </div>
        <div class="log-list">${items || '<p style="text-align:center;padding:20px;color:#aaa">Belum ada aksi tercatat.</p>'}</div>
    </div>`;
}

function parseMins(minStr) {
    if (!minStr || minStr === "0'") return 0;
    const parts = minStr.split("'");
    const mins = parseFloat(parts[0]) || 0;
    let secs = 0;
    if (parts[1]) {
        secs = parseFloat(parts[1].replace('"', '')) || 0;
    }
    return mins + (secs / 60);
}

function showPlayerDetail(teamChar, nomor) {
    const team   = teamChar === 'A' ? md.teamA : md.teamB;
    const player = team.players.find(p => p.nomor === nomor);
    if (!player) return;

    const s = team.stats?.[nomor] || { goals:0, misses:0, saves:0, fouls:0, yellowCards:0, twoMins:0, redCard:false, blueCard:false };
    const playingMinutes = getPlayingMinutes(teamChar);
    const playTimeStr = playingMinutes[nomor] || "0'";
    const minVal = parseMins(playTimeStr);

    const fouls  = s.fouls  || 0;
    const yCards = s.yellowCards || 0;
    const twoMin = s.twoMins    || 0;
    const rCard  = s.redCard    || false;
    const bCard  = s.blueCard   || false;

    const isGK = player.posisi === 'GK';

    // ── Shared inner zones constant ──────────────────────────────────
    const GK_INNER_ZONES = [
        'Atas Kiri','Atas Tengah','Atas Kanan',
        'Tengah Kiri','Tengah','Tengah Kanan',
        'Bawah Kiri','Bawah Tengah','Bawah Kanan'
    ];

    // ────────────────────────────────────────────────────────────────
    // BRANCH: GOALKEEPER
    // ────────────────────────────────────────────────────────────────
    let rating, bodyHtml;

    if (isGK) {
        // Data GK diambil dari events (sinkron dgn buildGKSection)
        const oppTeamChar = teamChar === 'A' ? 'B' : 'A';
        const evs = md.events || [];

        const incomingShots = evs.filter(e =>
            (e.type === 'GOAL' || e.type === 'MISS') &&
            e.team === oppTeamChar &&
            GK_INNER_ZONES.includes(e.zone)

        const gkGoalsConceded = incomingShots.filter(e => e.type === 'GOAL').length;
        const totalFaced      = incomingShots.length;

        const gkSaves         = incomingShots.filter(e => e.type === 'MISS').length;
        const savePct         = totalFaced > 0 ? Math.round((gkSaves / totalFaced) * 100) : 0;

        // Rating khusus GK
        rating = 6.0
            + (gkSaves         * 0.4)

        if (savePct >= 60) rating += 0.5;
        if (minVal > 0)    rating += (minVal * 0.02);

            </div>

                <div style="font-size:9px;font-weight:700;color:#7f8c8d;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;">⚽ Kemasukan</div>
            </div>
            <div style="background:#f0f4fb;border:1px solid #bfd0ec;border-radius:12px;padding:12px 6px;text-align:center;">

                <div style="font-size:9px;font-weight:700;color:#7f8c8d;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;">🎯 Shot Dihadapi</div>
            </div>
        </div>

        <!-- Save Rate bar -->
        <div class="player-stat-bar-row">

    // BRANCH: OUTFIELD PLAYER
    // ────────────────────────────────────────────────────────────────
    } else {
        const goals  = s.goals  || 0;
        const misses = s.misses || 0;
        const saves  = s.saves  || 0;
        const shots  = goals + misses;
        const acc    = shots > 0 ? Math.round((goals / shots) * 100) : 0;

        // Rating outfield
        rating = 6.0
            + (goals  * 0.8)
            - (misses * 0.4)
            + (saves  * 0.9)

        if (minVal > 0) rating += (minVal * 0.04);

window.switchPlayerActivityTab = function(btn, period) {
    const parent = btn.closest('.player-activity-section');
    if (!parent) return;
    parent.querySelectorAll('.player-activity-tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    parent.querySelectorAll('.player-activity-period-panel').forEach(p => {
        if (p.getAttribute('data-period') === String(period)) {
            p.classList.add('active');
        } else {
            p.classList.remove('active');
        }
    });
};

function buildPlayerActivitySection(player, teamChar, isGK) {
    const oppTeamChar = teamChar === 'A' ? 'B' : 'A';
    const evs = md.events || [];

    const ZONE_CENTERS = {
        'L1':{cx:95,cy:65},'L2':{cx:125,cy:145},'L3':{cx:135,cy:220},'L4':{cx:125,cy:295},'L5':{cx:95,cy:375},
        'L6':{cx:280,cy:65},'L7':{cx:300,cy:145},'L8':{cx:310,cy:220},'L9':{cx:300,cy:295},'L10':{cx:280,cy:375},
        'R1':{cx:785,cy:65},'R2':{cx:755,cy:145},'R3':{cx:745,cy:220},'R4':{cx:755,cy:295},'R5':{cx:785,cy:375},
        'R6':{cx:600,cy:65},'R7':{cx:580,cy:145},'R8':{cx:570,cy:220},'R9':{cx:580,cy:295},'R10':{cx:600,cy:375}
    };

    const ZONE_SHORT_LABELS = {
        'Atas Kiri':'AT KI', 'Atas Tengah':'AT TG', 'Atas Kanan':'AT KN',
        'Tengah Kiri':'TG KI', 'Tengah':'TG', 'Tengah Kanan':'TG KN',
        'Bawah Kiri':'BW KI', 'Bawah Tengah':'BW TG', 'Bawah Kanan':'BW KN'
    };

    const GK_INNER_ZONES = [
        'Atas Kiri','Atas Tengah','Atas Kanan',
        'Tengah Kiri','Tengah','Tengah Kanan',
        'Bawah Kiri','Bawah Tengah','Bawah Kanan'
    ];

    // Filter event individu dasar
    const allPlayerEvents = evs.filter(e => e.player && e.player.nomor === player.nomor && (!e.team || e.team === teamChar));
    const allOppShots = evs.filter(e => (e.type === 'GOAL' || e.type === 'MISS') && e.team === oppTeamChar);
    const allGkFouls = allPlayerEvents.filter(e => e.type === 'FOUL');

    function buildCourtSvg(eventsList) {
        const zoneUsage = {};
        const pinsSvg = eventsList.map((e) => {
            const z = e.courtZone;
            if (!z || !ZONE_CENTERS[z]) return '';
            const center = ZONE_CENTERS[z];
            const count = zoneUsage[z] || 0;
            zoneUsage[z] = count + 1;
            const angle = count * 1.5;
            const dist = count === 0 ? 0 : (14 + count * 3);
            const px = Math.round(center.cx + Math.cos(angle) * dist);
            const py = Math.round(center.cy + Math.sin(angle) * dist);

            let pinColor = '#2ecc71';
            let pinSym = '⚽';
            if (e.type === 'GOAL') {
                pinColor = '#2ecc71'; pinSym = '⚽';
            } else if (e.type === 'MISS') {
                pinColor = '#e74c3c'; pinSym = '✕';
            } else if (e.type === 'FOUL') {
                if (e.subtype === 'Kartu Kuning') { pinColor = '#f1c40f'; pinSym = '🟨'; }
                else if (e.subtype === '2 Menit') { pinColor = '#e67e22'; pinSym = '⏱'; }
                else if (e.subtype === 'Kartu Merah') { pinColor = '#e74c3c'; pinSym = '🟥'; }
                else if (e.subtype === 'Kartu Biru') { pinColor = '#2980b9'; pinSym = '🔵'; }
                else { pinColor = '#f39c12'; pinSym = '⚠️'; }
            } else if (e.type === 'SAVE') {
                pinColor = '#1abc9c'; pinSym = '🧤';
            }
            return `<g transform="translate(${px},${py})">
                <circle r="13" fill="${pinColor}" stroke="#ffffff" stroke-width="2.5" />
                <text y="4" text-anchor="middle" font-size="10" font-weight="800" fill="#ffffff">${pinSym}</text>
            </g>`;
        }).join('');

        return `
        <svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;border-radius:6px">
          <rect width="880" height="440" fill="#152e47"/>
          <rect x="40" y="20" width="800" height="400" fill="#1a3d60" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
          <line x1="440" y1="20" x2="440" y2="420" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
          <circle cx="440" cy="220" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
          <path d="M 40,70 A 120,120 0 0,1 160,190 L 160,250 A 120,120 0 0,1 40,370 Z" fill="rgba(241,196,15,0.08)"/>
          <path d="M 840,70 A 120,120 0 0,0 720,190 L 720,250 A 120,120 0 0,0 840,370 Z" fill="rgba(241,196,15,0.08)"/>
          <path d="M 40,70 A 120,120 0 0,1 160,190 L 160,250 A 120,120 0 0,1 40,370" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
          <path d="M 840,70 A 120,120 0 0,0 720,190 L 720,250 A 120,120 0 0,0 840,370" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
          <path d="M 40,10 A 180,180 0 0,1 220,190 L 220,250 A 180,180 0 0,1 40,430" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="6,5"/>
          <path d="M 840,10 A 180,180 0 0,0 660,190 L 660,250 A 180,180 0 0,0 840,430" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-dasharray="6,5"/>
          <rect x="25" y="190" width="15" height="60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          <rect x="840" y="190" width="15" height="60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          ${pinsSvg}
        </svg>`;
    }

    function getPeriodData(period) {
        const pFilter = (e) => (!period || period === 'all' || e.period == period);

        let courtEvents = [];
        if (isGK) {
            const oppShots = allOppShots.filter(e => e.courtZone && pFilter(e));
            const gkFouls = allGkFouls.filter(e => e.courtZone && pFilter(e));
            courtEvents = [...oppShots, ...gkFouls];
        } else {
            courtEvents = allPlayerEvents.filter(e => e.courtZone && pFilter(e));
        }

        let goalGridHtml = '';
        let goalMetaText = '';

        if (isGK) {
            const incomingShots = allOppShots.filter(e => GK_INNER_ZONES.includes(e.zone) && pFilter(e));
            const saveMap = {}, conMap = {};
            incomingShots.forEach(e => {
                const z = e.zone;
                if (e.type === 'MISS') saveMap[z] = (saveMap[z] || 0) + 1;
                if (e.type === 'GOAL') conMap[z] = (conMap[z] || 0) + 1;
            });

            const cells = GOAL_ZONE_ORDER.map(zk => {
                const s = saveMap[zk] || 0;
                const c = conMap[zk] || 0;
                const tot = s + c;
                const short = ZONE_SHORT_LABELS[zk] || zk;
                let cls = 'player-mini-goal-cell';
                let val = '<span style="color:#94a3b8;font-size:10px;">—</span>';
                if (tot > 0) {
                    if (c === 0) {
                        cls += ' has-goal';
                        val = `<span class="player-mini-goal-cell-val" style="color:#059669;">🧤${s}/${tot}</span>`;
                    } else if (s === 0) {
                        cls += ' has-miss';
                        val = `<span class="player-mini-goal-cell-val" style="color:#dc2626;">⚽${c}</span>`;
                    } else {
                        cls += ' has-both';
                        val = `<span class="player-mini-goal-cell-val" style="color:#d97706;">🧤${s} ⚽${c}</span>`;
                    }
                }
                return `<div class="${cls}">${val}<span class="player-mini-goal-cell-lbl">${short}</span></div>`;
            }).join('');

            goalGridHtml = `<div class="player-mini-goal-grid">${cells}</div>`;
            const totalFaced = incomingShots.length;
            const totalSaved = incomingShots.filter(e => e.type === 'MISS').length;
            const totalConceded = incomingShots.filter(e => e.type === 'GOAL').length;
            const savePct = totalFaced > 0 ? Math.round((totalSaved / totalFaced) * 100) : 0;
            goalMetaText = `Dihadapi: ${totalFaced} shot · 🧤${totalSaved} Save · ⚽${totalConceded} Gol · <strong>${savePct}% Save Rate</strong>`;
        } else {
            const pShots = allPlayerEvents.filter(e => (e.type === 'GOAL' || e.type === 'MISS') && pFilter(e));
            const goalMap = {}, missMap = {};
            pShots.forEach(e => {
                const z = e.zone;
                if (e.type === 'GOAL' && z) goalMap[z] = (goalMap[z] || 0) + 1;
                if (e.type === 'MISS' && z) missMap[z] = (missMap[z] || 0) + 1;
            });

            const cells = GOAL_ZONE_ORDER.map(zk => {
                const g = goalMap[zk] || 0;
                const m = missMap[zk] || 0;
                const short = ZONE_SHORT_LABELS[zk] || zk;
                let cls = 'player-mini-goal-cell';
                let val = '<span style="color:#94a3b8;font-size:10px;">—</span>';
                if (g > 0 && m > 0) {
                    cls += ' has-both';
                    val = `<span class="player-mini-goal-cell-val" style="color:#d97706;">⚽${g} ✕${m}</span>`;
                } else if (g > 0) {
                    cls += ' has-goal';
                    val = `<span class="player-mini-goal-cell-val" style="color:#059669;">⚽${g}</span>`;
                } else if (m > 0) {
                    cls += ' has-miss';
                    val = `<span class="player-mini-goal-cell-val" style="color:#dc2626;">✕${m}</span>`;
                }
                return `<div class="${cls}">${val}<span class="player-mini-goal-cell-lbl">${short}</span></div>`;
            }).join('');

            goalGridHtml = `<div class="player-mini-goal-grid">${cells}</div>`;
            const totalG = pShots.filter(e => e.type === 'GOAL').length;
            const totalM = pShots.filter(e => e.type === 'MISS').length;
            const totalS = totalG + totalM;
            const acc = totalS > 0 ? Math.round((totalG / totalS) * 100) : 0;
            
            const offTargets = pShots.filter(e => ['Luar Kiri','Luar Atas','Luar Kanan','Tiang/Mistar'].includes(e.zone));
            const offText = offTargets.length ? ` · Off: ${offTargets.length}` : '';
            goalMetaText = `Total: ${totalS} shot · ⚽${totalG} Gol · ✕${totalM} Miss · <strong>${acc}% Acc</strong>${offText}`;
        }

        return {
            courtEvents,
            courtSvg: buildCourtSvg(courtEvents),
            goalGridHtml,
            goalMetaText
        };
    }

    const renderPanel = (periodKey, periodLabel, isDefaultActive) => {
        const d = getPeriodData(periodKey);
        return `
        <div class="player-activity-period-panel ${isDefaultActive ? 'active' : ''}" data-period="${periodKey}">
            <div class="player-period-badge">⏱️ ${periodLabel.toUpperCase()}</div>
            <div class="player-activity-grid">
                <!-- Kolom Kiri: Peta Lapangan Mini -->
                <div class="player-activity-card">
                    <div class="player-activity-card-title">
                        <span>🏃 ${isGK ? 'Peta Ancaman Lawan' : 'Peta Aksi Lapangan'}</span>
                        <span class="player-activity-count">${d.courtEvents.length} aksi</span>
                    </div>
                    <div class="player-mini-court-wrap">
                        ${d.courtSvg}
                    </div>
                    <div class="player-mini-court-legend">
                        <span class="legend-item"><span class="legend-dot green"></span> Gol</span>
                        <span class="legend-item"><span class="legend-dot red"></span> Miss</span>
                        <span class="legend-item"><span class="legend-dot yellow"></span> Foul</span>
                    </div>
                </div>

                <!-- Kolom Kanan: Peta Target Gawang Mini -->
                <div class="player-activity-card">
                    <div class="player-activity-card-title">
                        <span>${isGK ? '🧤 Efektivitas Zona Gawang' : '🎯 Arah Tembakan (Gawang)'}</span>
                    </div>
                    <div class="player-mini-goal-wrap">
                        ${d.goalGridHtml}
                    </div>
                    <div class="player-activity-meta-text">
                        ${d.goalMetaText}
                    </div>
                </div>
            </div>
        </div>`;
    };

    // Urutan Babak Dinamis: SEMUA BABAK (TOTAL) di urutan paling atas, diikuti BABAK 1, BABAK 2, dst
    const infoPeriods = parseInt(md?.info?.periods, 10);
    const maxEvPeriod = Math.max(0, ...evs.map(e => parseInt(e.period, 10) || 0));
    const totalPeriods = infoPeriods > 0 ? Math.max(infoPeriods, maxEvPeriod) : (maxEvPeriod > 0 ? maxEvPeriod : 2);

    const periodsConfig = [
        { key: 'all', label: 'SEMUA BABAK (TOTAL)', tabLabel: 'Semua Babak' }
    ];
    for (let p = 1; p <= totalPeriods; p++) {
        periodsConfig.push({
            key: p,
            label: `BABAK ${p}`,
            tabLabel: `Babak ${p}`
        });
    }

    const tabsHtml = periodsConfig.map(p => `
        <button type="button" class="player-activity-tab-btn ${p.key === 'all' ? 'active' : ''}" onclick="switchPlayerActivityTab(this, '${p.key}')">${p.tabLabel}</button>
    `).join('');

    const panelsHtml = periodsConfig.map(p => renderPanel(p.key, p.label, p.key === 'all')).join('\n');

    return `
    <div class="player-activity-section">
        <div class="player-stats-section-title">Aktivitas Lapangan &amp; Target Gawang</div>
        
        <!-- Tab Bar Navigasi Interaktif (Layar) -->
        <div class="player-activity-tabs">
            ${tabsHtml}
        </div>

        <!-- Panel Babak Dinamis: Baris 1: Total, Baris 2: Babak 1, Baris 3: Babak 2, dst -->
        ${panelsHtml}
    </div>`;
}

    modal.classList.remove('show');

};

// ============================================================
// CETAK SEMUA PEMAIN (BATCH PRINT)
// ============================================================
function printAllPlayers() {
    if (!md) return;

    const GK_INNER_ZONES = [
        'Atas Kiri','Atas Tengah','Atas Kanan',
        'Tengah Kiri','Tengah','Tengah Kanan',
        'Bawah Kiri','Bawah Tengah','Bawah Kanan'
    ];
    const GOAL_ZONE_ORDER_P = [
        'Atas Kiri','Atas Tengah','Atas Kanan',
        'Tengah Kiri','Tengah','Tengah Kanan',
        'Bawah Kiri','Bawah Tengah','Bawah Kanan'
    ];
    const ZONE_SHORT_P = {
        'Atas Kiri':'AT KI','Atas Tengah':'AT TG','Atas Kanan':'AT KN',
        'Tengah Kiri':'TG KI','Tengah':'TG','Tengah Kanan':'TG KN',
        'Bawah Kiri':'BW KI','Bawah Tengah':'BW TG','Bawah Kanan':'BW KN'
    };
    const ZONE_CENTERS_P = {
        'L1':{cx:95,cy:65},'L2':{cx:125,cy:145},'L3':{cx:135,cy:220},'L4':{cx:125,cy:295},'L5':{cx:95,cy:375},
        'L6':{cx:280,cy:65},'L7':{cx:300,cy:145},'L8':{cx:310,cy:220},'L9':{cx:300,cy:295},'L10':{cx:280,cy:375},
        'R1':{cx:785,cy:65},'R2':{cx:755,cy:145},'R3':{cx:745,cy:220},'R4':{cx:755,cy:295},'R5':{cx:785,cy:375},
        'R6':{cx:600,cy:65},'R7':{cx:580,cy:145},'R8':{cx:570,cy:220},'R9':{cx:580,cy:295},'R10':{cx:600,cy:375}
    };

    const evs = md.events || [];
    const info = md.info || {};
    const compName = info.competition || 'AWIM Report';
    const scoreLabel = `${md.scoreA} – ${md.scoreB}`;

    // Kumpulkan semua pemain dari kedua tim
    const allPlayers = [];
    ['A', 'B'].forEach(tc => {
        const team = tc === 'A' ? md.teamA : md.teamB;
        if (!team || !team.players) return;
        team.players.forEach(p => allPlayers.push({ tc, team, player: p }));
    });

    if (allPlayers.length === 0) {
        alert('Tidak ada pemain terdaftar.');
        return;
    }

    function buildMiniCourtSvg(courtEvents) {
        const zoneUsage = {};
        const pins = courtEvents.map(e => {
            const z = e.courtZone;
            if (!z || !ZONE_CENTERS_P[z]) return '';
            const center = ZONE_CENTERS_P[z];
            const count = zoneUsage[z] || 0;
            zoneUsage[z] = count + 1;
            const angle = count * 1.5;
            const dist = count === 0 ? 0 : (14 + count * 3);
            const px = Math.round(center.cx + Math.cos(angle) * dist);
            const py = Math.round(center.cy + Math.sin(angle) * dist);
            let pinColor = '#2ecc71';
            let pinSym = '●';
            if (e.type === 'GOAL') { pinColor = '#2ecc71'; pinSym = '⚽'; }
            else if (e.type === 'MISS') { pinColor = '#e74c3c'; pinSym = '✕'; }
            else if (e.type === 'FOUL') {
                if (e.subtype === 'Kartu Kuning') { pinColor = '#f1c40f'; pinSym = '🟨'; }
                else if (e.subtype === '2 Menit') { pinColor = '#e67e22'; pinSym = '⏱'; }
                else if (e.subtype === 'Kartu Merah') { pinColor = '#e74c3c'; pinSym = '🟥'; }
                else if (e.subtype === 'Kartu Biru') { pinColor = '#2980b9'; pinSym = '🔵'; }
                else { pinColor = '#f39c12'; pinSym = '⚠️'; }
            }
            return `<g transform="translate(${px},${py})">
                <circle r="12" fill="${pinColor}" stroke="#fff" stroke-width="2"/>
                <text y="4" text-anchor="middle" font-size="9" font-weight="800" fill="#fff">${pinSym}</text>
            </g>`;
        }).join('');
        return `<svg viewBox="0 0 880 440" xmlns="http://www.w3.org/2000/svg" style="width:100%;display:block;border-radius:6px;">
          <rect width="880" height="440" fill="#152e47"/>
          <rect x="40" y="20" width="800" height="400" fill="#1a3d60" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
          <line x1="440" y1="20" x2="440" y2="420" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
          <circle cx="440" cy="220" r="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
          <path d="M 40,70 A 120,120 0 0,1 160,190 L 160,250 A 120,120 0 0,1 40,370 Z" fill="rgba(241,196,15,0.08)"/>
          <path d="M 840,70 A 120,120 0 0,0 720,190 L 720,250 A 120,120 0 0,0 840,370 Z" fill="rgba(241,196,15,0.08)"/>
          <rect x="25" y="190" width="15" height="60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          <rect x="840" y="190" width="15" height="60" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
          ${pins}
        </svg>`;
    }

    function buildMiniGoalGrid(isGK, tc, playerEvents, period) {
        const oppTc = tc === 'A' ? 'B' : 'A';
        const pFilter = (e) => (!period || period === 'all' || e.period == period);
        let metaText = '';
        if (isGK) {
            const shots = evs.filter(e => (e.type === 'GOAL' || e.type === 'MISS') && e.team === oppTc && GK_INNER_ZONES.includes(e.zone) && pFilter(e));
            const saveMap = {}, conMap = {};
            shots.forEach(e => {
                if (e.type === 'MISS') saveMap[e.zone] = (saveMap[e.zone] || 0) + 1;
                if (e.type === 'GOAL') conMap[e.zone] = (conMap[e.zone] || 0) + 1;
            });
            const tot = shots.length;
            const saved = shots.filter(e => e.type === 'MISS').length;
            const conc = tot - saved;
            const pct = tot > 0 ? Math.round((saved / tot) * 100) : 0;
            metaText = `Hadapi: ${tot} · 🧤${saved} · ⚽${conc} · ${pct}% SR`;
            const cells = GOAL_ZONE_ORDER_P.map(zk => {
                const s = saveMap[zk] || 0;
                const c = conMap[zk] || 0;
                const t = s + c;
                const short = ZONE_SHORT_P[zk] || zk;
                let cls = 'print-player-mini-goal-cell';
                let val = '<span style="color:#94a3b8;font-size:7px;">—</span>';
                if (t > 0) {
                    if (c === 0) { cls += ' has-goal'; val = `<span style="color:#059669;font-size:8px;font-weight:700;">🧤${s}</span>`; }
                    else if (s === 0) { cls += ' has-miss'; val = `<span style="color:#dc2626;font-size:8px;font-weight:700;">⚽${c}</span>`; }
                    else { cls += ' has-both'; val = `<span style="color:#d97706;font-size:7px;font-weight:700;">🧤${s}⚽${c}</span>`; }
                }
                return `<div class="${cls}">${val}<span style="font-size:5.5px;color:#94a3b8;display:block;line-height:1;">${short}</span></div>`;
            }).join('');
            return { cells, metaText };
        } else {
            const pShots = playerEvents.filter(e => (e.type === 'GOAL' || e.type === 'MISS') && GK_INNER_ZONES.includes(e.zone) && pFilter(e));
            const goalMap = {}, missMap = {};
            pShots.forEach(e => {
                if (e.type === 'GOAL' && e.zone) goalMap[e.zone] = (goalMap[e.zone] || 0) + 1;
                if (e.type === 'MISS' && e.zone) missMap[e.zone] = (missMap[e.zone] || 0) + 1;
            });
            const tot = pShots.length;
            const g = pShots.filter(e => e.type === 'GOAL').length;
            const m = tot - g;
            const acc = tot > 0 ? Math.round((g / tot) * 100) : 0;
            metaText = `Shot: ${tot} · ⚽${g} · ✕${m} · ${acc}% Acc`;
            const cells = GOAL_ZONE_ORDER_P.map(zk => {
                const gv = goalMap[zk] || 0;
                const mv = missMap[zk] || 0;
                const short = ZONE_SHORT_P[zk] || zk;
                let cls = 'print-player-mini-goal-cell';
                let val = '<span style="color:#94a3b8;font-size:7px;">—</span>';
                if (gv > 0 && mv > 0) { cls += ' has-both'; val = `<span style="color:#d97706;font-size:7.5px;font-weight:700;">⚽${gv}✕${mv}</span>`; }
                else if (gv > 0) { cls += ' has-goal'; val = `<span style="color:#059669;font-size:8px;font-weight:700;">⚽${gv}</span>`; }
                else if (mv > 0) { cls += ' has-miss'; val = `<span style="color:#dc2626;font-size:8px;font-weight:700;">✕${mv}</span>`; }
                return `<div class="${cls}">${val}<span style="font-size:5.5px;color:#94a3b8;display:block;line-height:1;">${short}</span></div>`;
            }).join('');
            return { cells, metaText };
        }
    }

    function renderPlayerCard(tc, team, player) {
        const nomor = player.nomor;
        const s = team.stats?.[nomor] || { goals:0, misses:0, saves:0, fouls:0, yellowCards:0, twoMins:0, redCard:false, blueCard:false };
        const isGK = player.posisi === 'GK';
        const teamColor = team.color || (tc === 'A' ? '#e74c3c' : '#1abc9c');
        const oppTc = tc === 'A' ? 'B' : 'A';

        const fouls  = s.fouls  || 0;
        const yCards = s.yellowCards || 0;
        const twoMin = s.twoMins    || 0;
        const rCard  = s.redCard    || false;
        const bCard  = s.blueCard   || false;

        const playerEvents = evs.filter(e => e.player && e.player.nomor === nomor && (!e.team || e.team === tc));

        let statsHtml = '';
        let rating;

        if (isGK) {
            const incoming = evs.filter(e =>
                (e.type === 'GOAL' || e.type === 'MISS') &&
                e.team === oppTc &&
                GK_INNER_ZONES.includes(e.zone)
            );
            const gkSaves   = incoming.filter(e => e.type === 'MISS').length;
            const gkConcede = incoming.filter(e => e.type === 'GOAL').length;
            const totalFaced = incoming.length;
            const savePct   = totalFaced > 0 ? Math.round((gkSaves / totalFaced) * 100) : 0;
            const saveBarColor = savePct >= 70 ? '#1abc9c' : savePct >= 50 ? '#f39c12' : '#e74c3c';
            rating = Math.min(10, Math.max(1, 6.0 + gkSaves * 0.4 - gkConcede * 0.3 + (savePct >= 60 ? 0.5 : 0)));

            statsHtml = `
            <div style="display:flex;gap:8px;margin-bottom:8px;">
                <div style="flex:1;text-align:center;background:#f0f9f5;border:1px solid #c3e8da;border-radius:6px;padding:6px 4px;">
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#16a085;">${gkSaves}</div>
                    <div style="font-size:7.5px;font-weight:700;color:#7f8c8d;text-transform:uppercase;">🧤 Saves</div>
                </div>
                <div style="flex:1;text-align:center;background:#fdf3f2;border:1px solid #f0c0ba;border-radius:6px;padding:6px 4px;">
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#c0392b;">${gkConcede}</div>
                    <div style="font-size:7.5px;font-weight:700;color:#7f8c8d;text-transform:uppercase;">⚽ Kemasukan</div>
                </div>
                <div style="flex:1;text-align:center;background:#f0f4fb;border:1px solid #bfd0ec;border-radius:6px;padding:6px 4px;">
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:#1a3a52;">${totalFaced}</div>
                    <div style="font-size:7.5px;font-weight:700;color:#7f8c8d;text-transform:uppercase;">🎯 Hadapi</div>
                </div>
            </div>
            <div style="margin-bottom:3px;display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:#444;">
                <span>📊 Save Rate</span><span>${savePct}%</span>
            </div>
            <div class="print-player-stat-progress-bar">
                <div class="print-player-stat-progress-fill" style="width:${savePct}%;background:${saveBarColor};"></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:8px;">
                <div style="flex:1;background:#fdf8f0;border:1px solid #fce0b0;border-radius:6px;padding:6px;text-align:center;">
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:800;color:#d35400;">${fouls}</div>
                    <div style="font-size:7.5px;font-weight:700;color:#7f8c8d;text-transform:uppercase;">⚠️ Fouls</div>
                </div>
                <div style="flex:2;background:#f5f7fa;border:1px solid #dde4ef;border-radius:6px;padding:6px 10px;display:flex;align-items:center;justify-content:space-between;">
                    <span style="font-size:10.5px;color:#888;">⏱ Menit Bermain</span>
                    <span style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;color:#1a3a52;">${s._playTime || '—'}</span>
                </div>
            </div>`;
        } else {
            const goals  = s.goals  || 0;
            const misses = s.misses || 0;
            const saves  = s.saves  || 0;
            const shots  = goals + misses;
            const acc    = shots > 0 ? Math.round((goals / shots) * 100) : 0;
            rating = Math.min(10, Math.max(1, 6.0 + goals * 0.8 - misses * 0.4 + saves * 0.9 - fouls * 0.2));

            let mxG = 1, mxM = 1, mxS = 1, mxF = 1;
            for (const pNo in team.stats) {
                const ps = team.stats[pNo];
                if ((ps.goals || 0)  > mxG) mxG = ps.goals;
                if ((ps.misses || 0) > mxM) mxM = ps.misses;
                if ((ps.saves || 0)  > mxS) mxS = ps.saves;
                if ((ps.fouls || 0)  > mxF) mxF = ps.fouls;
            }
            mxG = Math.max(mxG, 5); mxM = Math.max(mxM, 5); mxS = Math.max(mxS, 5); mxF = Math.max(mxF, 5);

            const row = (icon, label, val, max, color) => `
            <div style="margin-bottom:6px;">
                <div style="display:flex;justify-content:space-between;font-size:10.5px;font-weight:600;color:#444;margin-bottom:2px;">
                    <span>${icon} ${label}</span><span>${val}${label==='Accuracy'?'%':''}</span>
                </div>
                <div class="print-player-stat-progress-bar">
                    <div class="print-player-stat-progress-fill" style="width:${Math.round((val / Math.max(max, 5)) * 100)}%;background:${color};"></div>
                </div>
            </div>`;

            statsHtml =
                row('⚽', 'Goals', goals, mxG, 'linear-gradient(to right,#2ecc71,#27ae60)') +
                row('✕', 'Misses', misses, mxM, 'linear-gradient(to right,#e74c3c,#c0392b)') +
                row('🎯', 'Accuracy', acc, 100, 'linear-gradient(to right,#3498db,#2980b9)') +
                row('🧤', 'Saves', saves, mxS, 'linear-gradient(to right,#1abc9c,#16a085)') +
                row('⚠️', 'Fouls', fouls, mxF, 'linear-gradient(to right,#f39c12,#d35400)');
        }

        const badgeStyle = (bg, border) => `background:${bg};border:1px solid ${border};border-radius:4px;padding:2px 6px;font-size:8.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px;`;
        const cardDot = (c) => `<span style="width:8px;height:10px;border-radius:2px;background:${c};display:inline-block;"></span>`;
        const discipline = `
        <div style="margin-top:8px;padding-top:6px;border-top:1px solid #eee;display:flex;gap:5px;flex-wrap:wrap;">
            <span style="${badgeStyle('rgba(241,196,15,.1)','rgba(241,196,15,.4)')}">${cardDot('#f1c40f')} Kuning: ${yCards}</span>
            <span style="${badgeStyle('rgba(230,126,34,.1)','rgba(230,126,34,.4)')}">${cardDot('#e67e22')} 2' (×${twoMin})</span>
            <span style="${badgeStyle('rgba(231,76,60,.1)','rgba(231,76,60,.4)')}">${cardDot('#e74c3c')} Merah: ${rCard ? 'YA' : 'TDK'}</span>
            <span style="${badgeStyle('rgba(41,128,185,.1)','rgba(41,128,185,.4)')}">${cardDot('#2980b9')} Biru: ${bCard ? 'YA' : 'TDK'}</span>
        </div>`;

        const infoPeriods = parseInt(md?.info?.periods, 10);
        const maxEvPeriod = Math.max(0, ...(evs || []).map(e => parseInt(e.period, 10) || 0));
        const totalPeriods = infoPeriods > 0 ? Math.max(infoPeriods, maxEvPeriod) : (maxEvPeriod > 0 ? maxEvPeriod : 2);

        const periodsConfig = [
            { key: 'all', label: 'SEMUA BABAK (TOTAL)' }
        ];
        for (let p = 1; p <= totalPeriods; p++) {
            periodsConfig.push({ key: p, label: `BABAK ${p}` });
        }

        const periodPanelsHtml = periodsConfig.map(pConf => {
            const pFilter = (e) => (!pConf.key || pConf.key === 'all' || e.period == pConf.key);
            let pCourtEvents = [];
            if (isGK) {
                const oppShots = evs.filter(e => (e.type === 'GOAL' || e.type === 'MISS') && e.team === oppTc && e.courtZone && pFilter(e));
                const gkFouls  = playerEvents.filter(e => e.type === 'FOUL' && e.courtZone && pFilter(e));
                pCourtEvents = [...oppShots, ...gkFouls];
            } else {
                pCourtEvents = playerEvents.filter(e => e.courtZone && pFilter(e));
            }

            const pCourtSvg = buildMiniCourtSvg(pCourtEvents);
            const { cells: pGoalCells, metaText: pGoalMeta } = buildMiniGoalGrid(isGK, tc, playerEvents, pConf.key);

            return `
            <div class="print-player-period-panel">
                <div class="print-player-period-badge">⏱️ ${pConf.label}</div>
                <div class="print-player-activity-grid">
                    <div class="print-player-activity-card">
                        <div class="print-player-activity-header">
                            <span>${isGK ? '🏃 Ancaman Lawan' : '🏃 Aksi Lapangan'}</span>
                            <span>${pCourtEvents.length} aksi</span>
                        </div>
                        ${pCourtSvg}
                        <div style="padding:2px 6px;font-size:7px;color:#6b7f8e;display:flex;gap:6px;border-top:1px solid #eee;">
                            <span><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#2ecc71;margin-right:2px;"></span>Gol</span>
                            <span><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#e74c3c;margin-right:2px;"></span>Miss</span>
                            <span><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:#f39c12;margin-right:2px;"></span>Foul</span>
                        </div>
                    </div>
                    <div class="print-player-activity-card">
                        <div class="print-player-activity-header">
                            <span>${isGK ? '🧤 Zona Gawang' : '🎯 Arah Tembakan'}</span>
                        </div>
                        <div class="print-player-mini-goal-grid">${pGoalCells}</div>
                        <div style="padding:2px 6px;font-size:7px;color:#6b7f8e;border-top:1px solid #eee;text-align:center;">${pGoalMeta}</div>
                    </div>
                </div>
            </div>`;
        }).join('');

        const activitySection = `
        <div class="print-player-activity">
            <div style="font-size:9.5px;font-weight:700;color:#7f8c8d;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px;">
                📍 Aktivitas Lapangan &amp; Target Gawang
                <div style="flex:1;height:1px;background:#e2e8f0;"></div>
            </div>
            ${periodPanelsHtml}
        </div>`;

        const metaBar = `
        <div class="print-player-meta-bar">
            <div style="font-weight:800;letter-spacing:1px;color:#f39c12;">AWIM · ${compName}</div>
            <div style="font-weight:700;">Skor: ${scoreLabel}</div>
        </div>`;

        const gkBadge = isGK ? `<span style="font-size:8px;background:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.3);padding:1px 5px;border-radius:8px;margin-left:4px;">GK</span>` : '';
        const playerHeader = `
        <div class="print-player-header" style="background: linear-gradient(135deg, ${teamColor} 0%, #1a2c3a 100%) !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;">
            <div style="display:flex;align-items:center;gap:12px;overflow:hidden;">
                <div style="width:48px;height:48px;border-radius:50%;background:${teamColor};display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:white;border:2px solid rgba(255,255,255,0.4);flex-shrink:0;">${isGK ? '🧤' : nomor}</div>
                <div style="overflow:hidden;">
                    <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:white;letter-spacing:0.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${player.nama}${gkBadge}</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.7);margin-top:3px;">${isGK?'🧤':'🏃'} ${player.posisi} · 🛡️ ${team.name.toUpperCase()}</div>
                </div>
            </div>
            <div style="text-align:center;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:6px 12px;min-width:60px;flex-shrink:0;">
                <div style="font-size:8px;font-weight:700;color:#f39c12;letter-spacing:0.5px;text-transform:uppercase;">${isGK?'GK RTG':'RATING'}</div>
                <div style="font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:800;color:white;line-height:1.1;">${rating.toFixed(1)}</div>
            </div>
        </div>`;

        return `
        <div class="print-player-card">
            ${metaBar}
            ${playerHeader}
            <div class="print-player-stats">
                <div style="font-size:10px;font-weight:700;color:#7f8c8d;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;display:flex;align-items:center;gap:6px;">
                    ${isGK ? '🧤 Statistik Kiper' : '🎯 Statistik Utama'}
                    <div style="flex:1;height:1px;background:#e2e8f0;"></div>
                </div>
                ${statsHtml}
                ${discipline}
            </div>
            ${activitySection}
        </div>`;
    }

    // 1 pemain = 1 halaman A4
    const cards = allPlayers.map(({ tc, team, player }) => renderPlayerCard(tc, team, player));

    const container = document.getElementById('all-players-print-container');
    container.innerHTML = cards.join('');
    document.body.classList.add('print-all-players');
    window.print();
}

// ============================================================
// AUTO-REFRESH every 10s to get live data
// ============================================================
loadAndRender();
setInterval(loadAndRender, 10000);
</script>
